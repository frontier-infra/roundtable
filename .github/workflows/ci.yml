name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-docs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: No bare "pip install roundtable", no brew tap
        run: scripts/check-install-docs.sh
      - name: Usefulness bench scenarios and judge prompt are well formed
        run: python3 bench/run.py --validate

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and sdist, twine check, install and run
        run: tests/test-build.sh python

  plugin:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests parse and point at real files
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open(".claude-plugin/marketplace.json"))
          p = json.load(open(".claude-plugin/plugin.json"))
          assert m["name"] == "frontier-infra", m["name"]
          assert [x["name"] for x in m["plugins"]] == ["roundtable"]
          assert p["name"] == "roundtable"
          for f in ["bin/roundtable", "lib/mcp.py", "skills/roundtable/SKILL.md",
                    "commands/ask.md", "commands/setup.md"]:
              assert os.path.exists(f), f
          print("plugin manifests ok")
          PY
      - name: MCP server self-test
        run: bin/roundtable mcp --selftest
      - name: MCP progress heartbeat (a long run keeps clients waiting)
        run: |
          ROUNDTABLE_MCP_HEARTBEAT=0.1 python3 - <<'PY'
          import io, json, sys, time
          sys.path.insert(0, "lib")
          import mcp
          buf = io.StringIO(); sys.stdout = buf
          mcp.run_engine = lambda **k: (time.sleep(0.35), ("ok", False))[1]
          mcp.handle_tools_call(1, {"name": "roundtable", "arguments": {"question": "q"}, "_meta": {"progressToken": "t"}})
          sys.stdout = sys.__stdout__
          lines = [json.loads(l) for l in buf.getvalue().splitlines()]
          prog = [l["params"]["progress"] for l in lines if l.get("method") == "notifications/progress"]
          assert len(prog) >= 2 and prog == sorted(prog) and lines[-1]["id"] == 1, lines
          print("heartbeat ok", prog)
          PY
