# Desktop release: signed installers for Mac and Windows, and the updater manifest.
#
# Trigger: a desktop-v* tag pushed to this repo, or a manual run on such a tag.
# Never pull_request, so a fork can never start it or read its secrets.
#
# Runners: Blacksmith only. This repo is public, and our self-hosted runners
# (the Studio) serve private repos only.
#
# Versions (desktop/scripts/version.mjs): desktop/Cargo.toml holds the next release, say 0.1.2.
# - desktop-v0.1.2-rc.N is a test build. The build carries 0.1.2-rc.N, so every test build
#   has its own number. It goes to the rolling `desktop-test` pre-release and its latest.json,
#   which only apps with Settings, Updates, "Test builds" on read. No public release.
# - desktop-v0.1.2 is a stable release: the GitHub release `desktop-v0.1.2` and the
#   `desktop-latest` manifest every app reads. Only Jason approves a stable tag.
# Notes for both come from that version's section of desktop/CHANGELOG.md.
#
# Signing follows Support-Phone's release.yml (Mac) and release-publish.yml
# (Windows). Secret names and vault items are listed in desktop/README.md.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI: "@tauri-apps/cli@2.11.4"
  UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'

jobs:
  guard:
    name: what are we releasing
    if: github.repository == 'frontier-infra/roundtable'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release scripts work
        run: node --test desktop/scripts/release.test.mjs
      - name: Tag matches the app version, and the changelog has its section
        id: v
        run: |
          set -euo pipefail
          # tauri.conf.json has no version; Tauri takes it from the Cargo workspace.
          INFO="$(node desktop/scripts/version.mjs tag "$GITHUB_REF")"
          VERSION="$(echo "$INFO" | jq -r .version)"
          CHANNEL="$(echo "$INFO" | jq -r .channel)"
          node desktop/scripts/changelog.mjs check "$VERSION"
          { echo "tag=desktop-v$VERSION"; echo "version=$VERSION"; echo "channel=$CHANNEL"; } >> "$GITHUB_OUTPUT"
          echo "::notice::desktop-v$VERSION, channel $CHANNEL"

  mac:
    name: Mac (universal, signed and notarized)
    needs: guard
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      BUNDLE: desktop/target/universal-apple-darwin/release/bundle/macos
      APP_NAME: Roundtable.app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app, the engine and the About screen all report the tag's version (0.1.2-rc.1).
      - name: Stamp the version
        run: node desktop/scripts/version.mjs stamp "$VERSION"
      - run: npm ci
        working-directory: desktop/ui
      - run: npm install -g "$TAURI_CLI"

      - name: Checks before release
        working-directory: desktop
        run: |
          set -euo pipefail
          cargo test -p roundtable-engine
          cargo build -p roundtable-engine
          python3 scripts/parity.py target/debug/roundtable-engine
          target/debug/roundtable-engine mcp selftest

      # A release may not ship ad-hoc: Gatekeeper would block it for every user.
      - name: Require signing and notarization secrets
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          fail=0
          for v in HAS_CERT HAS_CERT_PW HAS_TEAM HAS_KEY HAS_KEY_ID HAS_ISSUER HAS_UPDATER_KEY; do
            [ "${!v}" = true ] || { echo "::error::secret for $v is not set"; fail=1; }
          done
          exit $fail

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/roundtable-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$CERT"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "identity: $IDENTITY"

      # App only. The DMG is built last, from the stapled app.
      - name: tauri build (Roundtable.app, universal)
        working-directory: desktop/core
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target universal-apple-darwin --bundles app --config "$UPDATER_CONFIG"

      - name: Verify the app signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$BUNDLE/$APP_NAME"
          codesign -dv "$BUNDLE/$APP_NAME" 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier|flags' || true
          lipo -info "$BUNDLE/$APP_NAME/Contents/MacOS/roundtable-engine"

      - name: Notarize and staple the app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="$BUNDLE/$APP_NAME"
          ZIP="$RUNNER_TEMP/notary-app.zip"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          # notarytool has exited 0 on a rejected submission; trust the status line.
          out="$(xcrun notarytool submit "$ZIP" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m 2>&1 | tee /dev/stderr)"
          rm "$KEY"
          echo "$out" | grep -qE '^\s*status: Accepted' || { echo "::error::app notarization was not Accepted"; exit 1; }
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      # The updater signature must cover the stapled app, so the archive is rebuilt.
      - name: Updater archive from the stapled app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="$PWD/dist/Roundtable_${VERSION}_universal.app.tar.gz"
          tar -C "$BUNDLE" -czf "$OUT" "$APP_NAME"
          tauri signer sign "$OUT"
          test -s "$OUT.sig" || { echo "::error::tauri signer made no .sig"; exit 1; }

      # dmgbuild, not the tauri DMG bundler: the DMG must hold the stapled app,
      # and dmgbuild writes the branded window layout (.DS_Store) itself, so no
      # Finder or AppleScript runs on a headless runner.
      - name: DMG from the stapled app, signed, notarized and stapled
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$PWD/dist/Roundtable_${VERSION}_universal.dmg"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s desktop/scripts/dmg-settings.py \
            -D app="$BUNDLE/$APP_NAME" -D background=desktop/core/dmg/background.png \
            "Roundtable" "$DMG"
          # The app inside the image must still be the signed, stapled one.
          MNT="$(mktemp -d "$RUNNER_TEMP/dmg-check.XXXX")"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          codesign --verify --deep --strict "$MNT/$APP_NAME"
          xcrun stapler validate "$MNT/$APP_NAME"
          test -f "$MNT/.DS_Store" && test -f "$MNT/.background.png"
          hdiutil detach "$MNT"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          out="$(xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m 2>&1 | tee /dev/stderr)"
          rm "$KEY"
          echo "$out" | grep -qE '^\s*status: Accepted' || { echo "::error::DMG notarization was not Accepted"; exit 1; }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *; do shasum -a 256 "$f" | tee "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: roundtable-desktop-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  windows:
    name: Windows (NSIS installer, Azure Trusted Signing)
    needs: guard
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 90
    # The Entra app titanium-gh-signing trusts this repo through a federated
    # credential (roundtable-desktop-release) with the immutable subject
    # repo:frontier-infra@276834721/roundtable@1272416852:environment:desktop-release.
    # The repo's OIDC subject setting has use_immutable_subject on, as Support-Phone.
    # With the repo variable WINDOWS_SIGNING unset, the job builds an UNSIGNED
    # installer, names its artifact so, and the publish job refuses to release it.
    environment: desktop-release
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      SIGN: ${{ vars.WINDOWS_SIGNING == 'on' }}
      NSIS_DIR: desktop/target/release/bundle/nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp the version
        run: node desktop/scripts/version.mjs stamp "$VERSION"
      - run: npm ci
        working-directory: desktop/ui
      - run: npm install -g "$TAURI_CLI"

      - name: Require the updater key
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: '[ "$HAS_UPDATER_KEY" = true ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }'

      # Compile first, sign after. The Azure CLI session from azure/login can
      # only get a new code-signing token while the GitHub OIDC assertion is
      # fresh (about 5 minutes). rc7 compiled for 10 minutes after the login
      # and the first signCommand failed. This step does the slow compile with
      # no Azure session, so the signed build below only bundles and signs.
      - name: Compile before the Azure login
        working-directory: desktop/core
        run: tauri build --no-bundle --config "$UPDATER_CONFIG"

      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Trusted Signing module
        if: env.SIGN == 'true'
        shell: pwsh
        run: Install-Module -Name TrustedSigning -RequiredVersion 0.5.8 -Scope CurrentUser -Force -Repository PSGallery

      - name: tauri build (NSIS)
        working-directory: desktop/core
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGN" = true ]; then
            tauri build --bundles nsis --config "$UPDATER_CONFIG" --config tauri.windows-signing.conf.json
          else
            echo "::warning::WINDOWS_SIGNING is not on: this installer is NOT Authenticode-signed and must not ship"
            tauri build --bundles nsis --config "$UPDATER_CONFIG"
          fi

      - name: Verify the installer and every packed binary
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item "$env:GITHUB_WORKSPACE/$env:NSIS_DIR/Roundtable_$($env:VERSION)_x64-setup.exe"
          $payload = Join-Path $env:RUNNER_TEMP 'roundtable-payload'
          & 7z x -tNsis $exe.FullName "-o$payload" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the NSIS installer' }
          $files = @(Get-ChildItem $payload -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          foreach ($file in @($exe) + $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or
                $sig.SignerCertificate.Subject -notmatch 'Titanium Computing' -or
                $null -eq $sig.TimeStamperCertificate) {
              throw "Invalid signature or timestamp: $($file.FullName)"
            }
            Write-Host "Verified: $($file.FullName)"
          }

      # The updater signature is made last, over the bytes that ship.
      - name: Updater signature over the final installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$NSIS_DIR/Roundtable_${VERSION}_x64-setup.exe"
          [ -f "$SRC" ] || { echo "::error::expected $SRC"; ls -l "$NSIS_DIR"; exit 1; }
          OUT="$PWD/dist/Roundtable_${VERSION}_x64-setup.exe"
          cp "$SRC" "$OUT"
          tauri signer sign "$OUT"
          test -s "$OUT.sig" || { echo "::error::tauri signer made no .sig"; exit 1; }
          cd dist
          for f in *; do sha256sum "$f" | tee "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN == 'true' && 'roundtable-desktop-windows' || 'roundtable-desktop-windows-UNSIGNED' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release and the Stable manifest
    needs: [guard, mac, windows]
    if: needs.guard.outputs.channel == 'stable'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: roundtable-desktop-macos
          path: out
      # Fails when only the UNSIGNED Windows artifact exists, which is the point.
      - uses: actions/download-artifact@v4
        with:
          name: roundtable-desktop-windows
          path: out
      - name: Release with installers, changelog notes and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node desktop/scripts/changelog.mjs section "$VERSION" > notes.md
          node desktop/scripts/latest-json.mjs out "$TAG" > latest.json
          gh release create "$TAG" out/* latest.json --title "Roundtable $VERSION" --notes-file notes.md \
            || { gh release edit "$TAG" --notes-file notes.md && gh release upload "$TAG" out/* latest.json --clobber; }
          # The rolling release every app checks, so a CLI release never looks like a desktop update.
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "Roundtable Desktop (latest)" --notes "Updater manifest for Roundtable Desktop." --latest=false
          gh release upload desktop-latest latest.json --clobber
          # A stable release is newer than every test build of it, so Test builds get it too.
          gh release view desktop-test >/dev/null 2>&1 && gh release upload desktop-test latest.json --clobber || true

  publish-test:
    name: Test channel (desktop-test pre-release and its manifest)
    needs: [guard, mac, windows]
    if: needs.guard.outputs.channel == 'test'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
      CHANNEL_RELEASE: desktop-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: roundtable-desktop-macos
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: roundtable-desktop-windows
          path: out
      - name: Upload to desktop-test and move its latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node desktop/scripts/latest-json.mjs out "$TAG" "$CHANNEL_RELEASE" > latest.json
          cat latest.json
          # One pre-release holds the newest test build. It is never "Latest" on the releases page.
          gh release view "$CHANNEL_RELEASE" >/dev/null 2>&1 || gh release create "$CHANNEL_RELEASE" --prerelease --latest=false \
            --title "Roundtable Desktop test builds" --notes "Test builds for Roundtable Desktop. Apps with Settings, Updates, Test builds on update from here."
          node desktop/scripts/changelog.mjs section "$VERSION" > notes.md
          { echo "Newest test build: **$VERSION**"; echo; cat notes.md; } > channel-notes.md
          gh release edit "$CHANNEL_RELEASE" --notes-file channel-notes.md --prerelease --latest=false
          # Files first, then the manifest that points at them.
          gh release upload "$CHANNEL_RELEASE" out/* --clobber
          gh release upload "$CHANNEL_RELEASE" latest.json --clobber
          # Keep this build and the one before it; remove older test files.
          gh release view "$CHANNEL_RELEASE" --json assets -q '.assets[].name' \
            | grep -E '^Roundtable_[^_]+_' | sed -E 's/^Roundtable_([^_]+)_.*/\1/' | sort -u > versions.txt
          KEEP="$(node desktop/scripts/version.mjs newest 2 < versions.txt)"
          gh release view "$CHANNEL_RELEASE" --json assets -q '.assets[].name' | while read -r f; do
            v="$(echo "$f" | sed -nE 's/^Roundtable_([^_]+)_.*/\1/p')"
            [ -n "$v" ] && ! echo "$KEEP" | grep -qx "$v" && gh release delete-asset "$CHANNEL_RELEASE" "$f" -y || true
          done
          echo "::notice::$VERSION is on the test channel: https://github.com/${{ github.repository }}/releases/tag/$CHANNEL_RELEASE"
