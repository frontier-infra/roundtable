[package]
name = "roundtable-desktop"
description = "Roundtable desktop app: ask several AIs at once, from a native window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "roundtable_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "roundtable-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
roundtable-engine = { path = "../engine", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"

[features]
# The Frontier labs persona pack. Build the app and its engine without it with
# `ROUNDTABLE_NO_LAB_PACK=1 cargo tauri build -- --no-default-features`.
default = ["lab-pack"]
lab-pack = ["roundtable-engine/lab-pack"]

[dev-dependencies]
# Parses menu shortcuts in a test, exactly as the menu does (the version Tauri uses).
muda = { version = "0.20", default-features = false }
tempfile = "3"
semver = "1"
