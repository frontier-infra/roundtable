[package]
name = "roundtable-engine"
description = "The Roundtable engine: asks several AI models one question, with a Claude chair."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "roundtable_engine"
path = "src/lib.rs"

[[bin]]
name = "roundtable-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
# The Frontier labs persona pack. Build with --no-default-features to leave it out.
default = ["lab-pack"]
lab-pack = []

[dev-dependencies]
tempfile = "3"
